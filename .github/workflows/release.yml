name: Build and publish release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (example: 0.9.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image tooling
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Validate version and sources
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n[:space:]' < VERSION)"
          REQUESTED_VERSION="${{ inputs.version }}"
          if [ -n "$REQUESTED_VERSION" ]; then test "$VERSION" = "$REQUESTED_VERSION"; fi
          test "$VERSION" = "$(tr -d '\r\n[:space:]' < VERSION)"
          test "$VERSION" = "$(tr -d '\r\n[:space:]' < toolbox/VERSION)"
          grep -Fq "TOOLBOX_VERSION=\"$VERSION\"" toolbox/umu-toolbox.sh
          test -s packaging/install.sh
          grep -Fq "installation du package" packaging/install.sh
          bash -n install.sh
          bash -n packaging/install.sh
          bash -n uninstall.sh
          bash -n toolbox/umu-toolbox.sh
          bash -n toolbox/overlay/bin/wine
          bash -n toolbox/overlay/bin/wine64
          bash -n toolbox/overlay/bin/wineserver
          python3 -m py_compile toolbox/umu-gameid-manager.py toolbox/umu-gameid-resolver.py toolbox/overlay/umu-batocera/umu-gameid-resolver.py toolbox/overlay/umu-batocera/umu-root-runner.py
          python3 -m unittest discover -s tests -v
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build verified package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n[:space:]' < VERSION)"
          REQUESTED_VERSION="${{ inputs.version }}"
          if [ -n "$REQUESTED_VERSION" ]; then test "$VERSION" = "$REQUESTED_VERSION"; fi
          PKG="UMU-Runner-Toolbox-v$VERSION"
          rm -rf "$PKG"
          mkdir -p "$PKG"
          rsync -a ./ "$PKG/" \
            --exclude '.git/' \
            --exclude 'assets/' \
            --exclude '.github/' \
            --exclude 'packaging/' \
            --exclude "$PKG/" \
            --exclude '__pycache__/' \
            --exclude '*.pyc'
          cp packaging/install.sh "$PKG/install.sh"
          python3 .github/scripts/prepare-scraper-assets.py "$PKG/toolbox/scraper-assets"
          chmod +x "$PKG/install.sh" "$PKG/uninstall.sh" "$PKG/toolbox/umu-toolbox.sh" "$PKG/toolbox/overlay/bin/"*
          test "$(tr -d '\r\n[:space:]' < "$PKG/VERSION")" = "$VERSION"
          test "$(tr -d '\r\n[:space:]' < "$PKG/toolbox/VERSION")" = "$VERSION"
          grep -Fq "installation du package" "$PKG/install.sh"
          if cmp -s install.sh "$PKG/install.sh"; then
            echo "ERROR: package installer must not be the public bootstrap installer." >&2
            exit 1
          fi
          find "$PKG" -type d -name __pycache__ -prune -exec rm -rf {} +
          zip -qr "$PKG.zip" "$PKG"
          sha256sum "$PKG.zip" > "$PKG.zip.sha256"
          unzip -t "$PKG.zip"
          cat "$PKG.zip.sha256"

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n[:space:]' < VERSION)"
          REQUESTED_VERSION="${{ inputs.version }}"
          if [ -n "$REQUESTED_VERSION" ]; then test "$VERSION" = "$REQUESTED_VERSION"; fi
          PKG="UMU-Runner-Toolbox-v$VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$PKG.zip" "$PKG.zip.sha256" --clobber
            gh release edit "v$VERSION" --title "UMU Runner Toolbox v$VERSION" --notes-file RELEASE_NOTES.md
          else
            gh release create "v$VERSION" \
              "$PKG.zip" "$PKG.zip.sha256" \
              --target "${{ github.sha }}" \
              --title "UMU Runner Toolbox v$VERSION" \
              --notes-file RELEASE_NOTES.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
